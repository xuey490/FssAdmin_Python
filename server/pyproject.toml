[project]
name = "backend"
version = "1.0.0"
description = "Fssdmin后端工程"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno==3.1.5",
    "aiofiles==25.1.0",                         # 文件操作
    "aiosmtplib==5.1.3",                        # 异步 SMTP（fastapi-mail 1.6 要求 >=5）
    "aiosqlite==0.22.1",                        # sqlite 异步操作数据库
    "alembic==1.20.0",                          # 数据库迁移
    "apscheduler==3.11.3",                      # 定时任务
    "asyncmy==0.2.16",                          # mysql 异步驱动（高性能 C 实现）
    "asyncpg==0.32.0",                          # postgresql 异步驱动
    "bleach==6.4.0",                            # HTML 标签过滤
    "tinycss2==1.5.1",                          # CSS 解析（weasyprint 依赖）
    "click==8.5.0",                             # 命令行参数解析
    "croniter==6.2.4",                          # cron 表达式解析
    "cryptography==50.0.2",                     # mysql8 密码加密（fastapi-mail 要求 50.x）
    "fastapi==0.148.0",                         # FastAPI 框架
    "fastapi-limiter==0.2.0",                   # 接口限流
    "fastapi-cachex[redis]>=0.5.1",             # 缓存（redis6.0）
    "fastapi-mail==1.6.8",                      # 邮件发送
    "greenlet==3.5.6",                          # SQLAlchemy 异步协程核心
    "httpx==0.28.1",                            # HTTP 客户端
    "jinja2==3.1.6",                            # 模板引擎
    "loguru==0.7.3",                            # 日志
    "openai==3.35.1",                           # OpenAI API 客户端
    "openpyxl==3.1.5",                          # Excel 读写
    "pandas==3.0.6",                            # 数据处理
    "pillow==13.0.0",                           # 图片处理
    "psutil==7.2.2",                            # 系统信息
    "psycopg[binary]==3.3.6",                   # postgresql 同步驱动（含预编译 libpq）
    "pydantic>=2.14.1",                         # 数据校验
    "pydantic-settings>=2.16.0",                # 配置管理
    "pyjwt==2.15.1",                            # JWT / OAuth2
    "pymysql==1.2.3",                           # mysql 同步驱动（纯 Python）
    "python-multipart==0.0.32",                 # 表单解析
    "redis>=6.0.0",                             # Redis（保持不升主版本）
    "rich==15.0.0",                             # 终端美化
    "sqlalchemy==2.1.5",                        # 数据库 ORM
    "sqlglot[rs]==30.23.0",                     # SQL 解析/转译
    "typer==0.27.3",                            # CLI 工具
    "ua-parser==1.0.2",                         # User-Agent 解析
    "uvicorn==0.54.0",                          # ASGI 服务器
    "websockets==17.2",                         # WebSocket 通信
    "weasyprint==70.0",                         # PDF 生成
    "starlette==1.9.0",                         # FastAPI 底层 ASGI 框架（fastapi-mail 要求 >=1）
    "python-dotenv==1.2.4",                     # .env 文件加载
    "bcrypt==5.0.0",                            # 密码哈希
    "yt-dlp>=2026.8.19",                        # 视频下载
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0,<3",   # 测试：内存 Redis，配合 TESTING
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",  # 异步测试支持
    "ruff==0.17.1",           # 代码检查/格式化
]

[tool.uv]
default-groups = ["dev"]     # 本地 uv sync 含 dev；生产 pip -r requirements.txt 不含 pytest/ruff/fakeredis
index-strategy = "unsafe-best-match"   # 允许从所有索引中选取最佳匹配版本

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.ruff]
line-length = 200
indent-width = 4
preview = false
fix = true
show-fixes = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = [
    "FAST",
    "F",
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "B904",  # Within an `except` clause
    "B010",  # Do not call with a constant attribute value.
    "B009",  # Do not use getattr() with a constant attribute value.
    "E712",  # Avoid equality comparisons to `False`; use `not getattr(self.model, "is_deleted"):` for false checks
    "W293",  # blank line with whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # 先设置 TESTING/SQLite 环境再 import 应用

[tool.ruff.format]
docstring-code-format = true
preview = false
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
